trigger:
  branches:
    include:
      - main
  paths:
    include:
      - examples/enterprise_mcp_platform/policy/*
      - examples/enterprise_mcp_platform/policy/cedar/*
      - examples/enterprise_mcp_platform/pipelines/azure-devops/policy-ci.yml

# Azure Repos PR validation is enforced by a required branch policy, not this
# YAML block. Configure the same path filters in Azure DevOps branch policies.
pr: none

parameters:
  - name: publishCedarSource
    displayName: Publish Cedar source artifact
    type: boolean
    default: false

pool:
  name: $(AZDO_AGENT_POOL)

steps:
  - checkout: self
    clean: true

  - bash: |
      set -euo pipefail
      cd examples/enterprise_mcp_platform
      cedar_files="$(find policy/cedar -type f -name '*.cedar' -print)"
      test -n "$cedar_files"
      while IFS= read -r cedar_file; do
        test -s "$cedar_file"
        grep -q 'resource == AgentCore::Gateway::"__GATEWAY_ARN__"' "$cedar_file"
      done <<EOF
      $cedar_files
      EOF
      if find policy \( -path '*/generated/*' -o -type f \( -name '*.yaml' -o -name '*.schema.json' -o -name 'policy.review.json' \) \) | grep -q .; then
        echo "Legacy or generated policy artifact found; direct Cedar must remain the only policy source."
        exit 1
      fi
    displayName: Check direct Cedar policy source

  - task: PublishBuildArtifacts@1
    displayName: Publish Cedar source
    condition: and(succeeded(), eq('${{ parameters.publishCedarSource }}', 'true'))
    inputs:
      PathtoPublish: examples/enterprise_mcp_platform/policy
      ArtifactName: enterprise-mcp-policy
      publishLocation: Container
