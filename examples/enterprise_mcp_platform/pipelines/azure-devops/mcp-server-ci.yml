trigger:
  branches:
    include:
      - main
  paths:
    include:
      - examples/enterprise_mcp_platform/common/*
      - examples/enterprise_mcp_platform/common/**/*
      - examples/enterprise_mcp_platform/gateway/*.py
      - examples/enterprise_mcp_platform/images/mcp_python_base/container_healthcheck.py
      - examples/enterprise_mcp_platform/requirements.txt
      - examples/enterprise_mcp_platform/servers/*
      - examples/enterprise_mcp_platform/servers/**/*
      - examples/enterprise_mcp_platform/pipelines/azure-devops/mcp-server-ci.yml

# Azure Repos PR validation is enforced by required branch policies, not this
# YAML block. Configure matching path filters in Azure DevOps branch policies.
pr: none

parameters:
  - name: server
    displayName: MCP server
    type: string
    default: all
    values:
      - all
      - sharepoint_mcp
      - crm_mcp
      - internal_software_mcp

  - name: publishImage
    displayName: Push image to central ECR
    type: boolean
    default: false

  - name: imageTag
    displayName: Image tag for manual publish
    type: string
    default: manual

variables:
  PYTHON_EXECUTABLE: python3
  AWS_REGION: ap-southeast-2

pool:
  name: $(AZDO_AGENT_POOL)

stages:
  - stage: ValidateAndBuild
    displayName: Validate and build MCP server images
    jobs:
      - job: BuildImages
        displayName: Build MCP server images
        strategy:
          matrix:
            sharepoint_mcp:
              SERVER_NAME: sharepoint_mcp
              SERVICE_REQUIREMENTS: servers/sharepoint_mcp/requirements.txt
              DOCKERFILE: servers/sharepoint_mcp/Dockerfile
              IMAGE_NAME: sharepoint-mcp
            crm_mcp:
              SERVER_NAME: crm_mcp
              SERVICE_REQUIREMENTS: servers/crm_mcp/requirements.txt
              DOCKERFILE: servers/crm_mcp/Dockerfile
              IMAGE_NAME: crm-mcp
            internal_software_mcp:
              SERVER_NAME: internal_software_mcp
              SERVICE_REQUIREMENTS: servers/internal_software_mcp/requirements.txt
              DOCKERFILE: servers/internal_software_mcp/Dockerfile
              IMAGE_NAME: internal-software-mcp
        steps:
          - checkout: self
            clean: true

          - bash: |
              set -euo pipefail
              if [ '${{ parameters.server }}' != 'all' ] && [ '${{ parameters.server }}' != '$(SERVER_NAME)' ]; then
                echo "Skipping $(SERVER_NAME)"
                echo "##vso[task.setvariable variable=SKIP_SERVER]true"
              fi
            displayName: Select requested server

          - bash: |
              set -euo pipefail
              cd examples/enterprise_mcp_platform
              "$(PYTHON_EXECUTABLE)" -m venv .venv
              . .venv/bin/activate
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install -r "$(SERVICE_REQUIREMENTS)"
            displayName: Install Python dependencies
            condition: ne(variables.SKIP_SERVER, 'true')

          - bash: |
              set -euo pipefail
              cd examples/enterprise_mcp_platform
              . .venv/bin/activate
              PYTHONDONTWRITEBYTECODE=1 python -m py_compile \
                $(find common "servers/$(SERVER_NAME)" -name '*.py' | sort)
            displayName: Compile server Python
            condition: ne(variables.SKIP_SERVER, 'true')

          - bash: |
              set -euo pipefail
              cd examples/enterprise_mcp_platform
              . .venv/bin/activate
              SERVER_NAME="$(SERVER_NAME)" python - <<'PY'
              import importlib
              import os

              from mcp.server.mcpserver import MCPServer

              if os.environ["SERVER_NAME"] == "sharepoint_mcp":
                  os.environ["GRAPH_DRY_RUN"] = "true"
              module = importlib.import_module(
                  f"servers.{os.environ['SERVER_NAME']}.src.server"
              )
              assert isinstance(module.mcp, MCPServer)
              PY
            displayName: Validate MCPServer SDK v2
            condition: ne(variables.SKIP_SERVER, 'true')

          - bash: |
              set -euo pipefail
              cd examples/enterprise_mcp_platform
              . .venv/bin/activate
              if [ "$(SERVER_NAME)" = "sharepoint_mcp" ]; then
                PYTHONDONTWRITEBYTECODE=1 python -m unittest discover \
                  -s servers/sharepoint_mcp \
                  -p 'test_*.py'
                PYTHONDONTWRITEBYTECODE=1 python -m unittest discover \
                  -s gateway \
                  -p 'test_*.py'
              fi
            displayName: Run server unit tests
            condition: ne(variables.SKIP_SERVER, 'true')

          - bash: |
              set -euo pipefail
              cd examples/enterprise_mcp_platform
              platform_args=()
              if [ "$(SERVER_NAME)" = "sharepoint_mcp" ]; then
                platform_args=(--platform linux/arm64)
              fi
              docker build "${platform_args[@]}" \
                --file "$(DOCKERFILE)" \
                --tag "$(IMAGE_NAME):$(Build.SourceVersion)" \
                .
            displayName: Build Docker image
            condition: ne(variables.SKIP_SERVER, 'true')

          - bash: |
              set -euo pipefail
              test -n "$(INTERNAL_ECR_REGISTRY)"
              aws ecr get-login-password --region "$(AWS_REGION)" \
                | docker login --username AWS --password-stdin "$(INTERNAL_ECR_REGISTRY)"
              image_uri="$(INTERNAL_ECR_REGISTRY)/$(IMAGE_NAME):${{ parameters.imageTag }}"
              docker tag "$(IMAGE_NAME):$(Build.SourceVersion)" "$image_uri"
              docker push "$image_uri"
              echo "Published $image_uri"
            displayName: Push Docker image to central ECR
            condition: and(succeeded(), ne(variables.SKIP_SERVER, 'true'), eq('${{ parameters.publishImage }}', 'true'))
