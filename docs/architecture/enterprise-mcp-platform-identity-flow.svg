<text x="500.0" y="129.5" text-anchor="middle" class="box-title">1. Approved caller</text>
<text x="500.0" y="151.5" text-anchor="middle" class="box-detail">Employee via AI app or autonomous workload</text>
<rect x="320" y="210" width="360" height="75" rx="10" fill="#F1ECFA" stroke="#6F42C1" stroke-width="2"/>
<text x="500.0" y="239.5" text-anchor="middle" class="box-title">2. Microsoft Entra</text>
<text x="500.0" y="261.5" text-anchor="middle" class="box-detail">Issues delegated or app-only Enterprise MCP token</text>
<rect x="320" y="320" width="360" height="75" rx="10" fill="#EAF2F8" stroke="#2E74B5" stroke-width="2"/>
<text x="500.0" y="349.5" text-anchor="middle" class="box-title">3. AgentCore Gateway</text>
<text x="500.0" y="371.5" text-anchor="middle" class="box-detail">Validates issuer, audience, expiry and client</text>
<rect x="320" y="430" width="360" height="80" rx="10" fill="#EAF2F8" stroke="#2E74B5" stroke-width="2"/>
<text x="500.0" y="462.0" text-anchor="middle" class="box-title">4. Direct Cedar</text>
<text x="500.0" y="484.0" text-anchor="middle" class="box-detail">Authorizes exact target-qualified tool and input</text>
<rect x="70" y="575" width="360" height="50" rx="10" fill="#F1ECFA" stroke="#6F42C1" stroke-width="2"/>
<text x="250.0" y="592.0" text-anchor="middle" class="box-title">5A. AgentCore Identity OBO</text>
<text x="250.0" y="614.0" text-anchor="middle" class="box-detail">Token A to Runtime Token B</text>
<rect x="70" y="660" width="360" height="85" rx="10" fill="#EAF6EC" stroke="#2E7D32" stroke-width="2"/>
<text x="250.0" y="694.5" text-anchor="middle" class="box-title">6A. SharePoint delegated Runtime</text>
<text x="250.0" y="716.5" text-anchor="middle" class="box-detail">Validate Token B and tool input</text>
<rect x="570" y="660" width="360" height="85" rx="10" fill="#EAF6EC" stroke="#2E7D32" stroke-width="2"/>
<text x="750.0" y="694.5" text-anchor="middle" class="box-title">5B. SharePoint M2M Runtime</text>
<text x="750.0" y="716.5" text-anchor="middle" class="box-detail">SigV4 + caller revalidation</text>
<rect x="70" y="800" width="360" height="85" rx="10" fill="#F1ECFA" stroke="#6F42C1" stroke-width="2"/>
<text x="250.0" y="834.5" text-anchor="middle" class="box-title">7A. AgentCore Identity OBO</text>
<text x="250.0" y="856.5" text-anchor="middle" class="box-detail">Runtime Token B to delegated Graph Token C</text>
<rect x="570" y="800" width="360" height="85" rx="10" fill="#F1ECFA" stroke="#6F42C1" stroke-width="2"/>
<text x="750.0" y="834.5" text-anchor="middle" class="box-title">6B. AgentCore Identity M2M</text>
<text x="750.0" y="856.5" text-anchor="middle" class="box-detail">Lane-scoped Graph application token</text>
<rect x="320" y="950" width="360" height="85" rx="10" fill="#FFF3E0" stroke="#C56A00" stroke-width="2"/>
<text x="500.0" y="984.5" text-anchor="middle" class="box-title">8. Microsoft Graph / SharePoint</text>
<text x="500.0" y="1006.5" text-anchor="middle" class="box-detail">Executes the requested operation</text>
<rect x="70" y="1100" width="360" height="90" rx="10" fill="#FFF3E0" stroke="#C56A00" stroke-width="2"/>
<text x="250.0" y="1137.0" text-anchor="middle" class="box-title">9A. Employee native ACL</text>
<text x="250.0" y="1159.0" text-anchor="middle" class="box-detail">Site A allowed; B/C/D denied</text>
<rect x="570" y="1100" width="360" height="90" rx="10" fill="#FFF3E0" stroke="#C56A00" stroke-width="2"/>
<text x="750.0" y="1137.0" text-anchor="middle" class="box-title">9B. Application site grants</text>
<text x="750.0" y="1159.0" text-anchor="middle" class="box-detail">Explicit Sites.Selected only</text>
