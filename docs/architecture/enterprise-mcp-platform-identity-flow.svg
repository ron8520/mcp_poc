<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1320" viewBox="0 0 1000 1320">
<defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:27px;font-weight:700;fill:#17324D}.subtitle{font-size:16px;fill:#526579}.zone{font-size:17px;font-weight:700;fill:#17324D}.box-title{font-size:18px;font-weight:700;fill:#17324D}.box-detail{font-size:15px;fill:#526579}.edge-label{font-size:13px;fill:#526579}</style>
<marker id="arrow-line" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#7890A8"/></marker>
<marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#B42318"/></marker>
<marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#6F42C1"/></marker>
<marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#2E74B5"/></marker>
<marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#C56A00"/></marker>
<marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#2E7D32"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="35" y="48" class="title">Identity, Authorization and Data Flow</text>
<text x="35" y="76" class="subtitle">Caller identity, AWS workload authorization and downstream Graph identity remain separate</text>
<path d="M 500.0 180.0 L 500.0 220.0" fill="none" stroke="#7890A8" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" marker-end="url(#arrow-line)"/>
<rect x="501.0" y="183.0" width="74.4" height="17" fill="#FFFFFF" opacity="0.92"/>
<text x="504.0" y="195.0" class="edge-label">authenticate</text>
<path d="M 500.0 300.0 L 500.0 340.0" fill="none" stroke="#7890A8" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" marker-end="url(#arrow-line)"/>
<rect x="501.0" y="303.0" width="142.6" height="17" fill="#FFFFFF" opacity="0.92"/>
<text x="504.0" y="315.0" class="edge-label">issue Token A to caller</text>
<path d="M 500.0 420.0 L 500.0 460.0" fill="none" stroke="#7890A8" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" marker-end="url(#arrow-line)"/>
<rect x="501.0" y="423.0" width="124.0" height="17" fill="#FFFFFF" opacity="0.92"/>
<text x="504.0" y="435.0" class="edge-label">MCP + Bearer Token A</text>
<path d="M 500.0 540.0 L 500.0 580.0" fill="none" stroke="#7890A8" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" marker-end="url(#arrow-line)"/>
<rect x="501.0" y="543.0" width="105.4" height="17" fill="#FFFFFF" opacity="0.92"/>
<text x="504.0" y="555.0" class="edge-label">validated context</text>
<path d="M 500.0 660.0 L 500.0 700.0" fill="none" stroke="#7890A8" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" marker-end="url(#arrow-line)"/>
<rect x="501.0" y="663.0" width="45.0" height="17" fill="#FFFFFF" opacity="0.92"/>
<text x="504.0" y="675.0" class="edge-label">allow</text>
<path d="M 500.0 780.0 L 500.0 820.0" fill="none" stroke="#7890A8" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" marker-end="url(#arrow-line)"/>
<rect x="501.0" y="783.0" width="45.0" height="17" fill="#FFFFFF" opacity="0.92"/>
<text x="504.0" y="795.0" class="edge-label">SigV4</text>
<path d="M 500.0 900.0 L 500.0 940.0" fill="none" stroke="#7890A8" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" marker-end="url(#arrow-line)"/>
<rect x="501.0" y="903.0" width="117.8" height="17" fill="#FFFFFF" opacity="0.92"/>
<text x="504.0" y="915.0" class="edge-label">Graph API + Token B</text>
<path d="M 320.0 500.0 L 290.0 500.0 L 290.0 525.0 L 270.0 525.0" fill="none" stroke="#B42318" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" marker-end="url(#arrow-red)" stroke-dasharray="7 5"/>
<path d="M 320.0 620.0 L 295.0 620.0 L 295.0 570.0 L 270.0 570.0" fill="none" stroke="#B42318" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" marker-end="url(#arrow-red)" stroke-dasharray="7 5"/>
<path d="M 320.0 848.0 L 280.0 848.0 L 280.0 615.0 L 270.0 615.0" fill="none" stroke="#B42318" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" marker-end="url(#arrow-red)" stroke-dasharray="7 5"/>
<path d="M 320.0 872.0 L 285.0 872.0 L 285.0 1129.6 L 270.0 1129.6" fill="none" stroke="#2E7D32" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" marker-end="url(#arrow-green)" stroke-dasharray="7 5"/>
<rect x="172.0" y="972.8" width="105.4" height="17" fill="#FFFFFF" opacity="0.92"/>
<text x="175.0" y="984.8" class="edge-label">decision + result</text>
<path d="M 270.0 287.5 L 295.0 287.5 L 295.0 380.0 L 320.0 380.0" fill="none" stroke="#6F42C1" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" marker-end="url(#arrow-purple)" stroke-dasharray="7 5"/>
<path d="M 730.0 740.0 L 680.0 740.0" fill="none" stroke="#2E74B5" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" marker-end="url(#arrow-blue)" stroke-dasharray="7 5"/>
<path d="M 730.0 985.0 L 680.0 985.0" fill="none" stroke="#C56A00" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" marker-end="url(#arrow-orange)" stroke-dasharray="7 5"/>
<rect x="320" y="100" width="360" height="80" rx="10" fill="#FFFFFF" stroke="#6F42C1" stroke-width="2"/>
<text x="500.0" y="132.0" text-anchor="middle" class="box-title">1. Approved caller</text>
<text x="500.0" y="154.0" text-anchor="middle" class="box-detail">Managed device or AWS AI workload</text>
<rect x="320" y="220" width="360" height="80" rx="10" fill="#F1ECFA" stroke="#6F42C1" stroke-width="2"/>
<text x="500.0" y="252.0" text-anchor="middle" class="box-title">2. Microsoft Entra</text>
<text x="500.0" y="274.0" text-anchor="middle" class="box-detail">Authenticates caller and issues Token A</text>
<rect x="320" y="340" width="360" height="80" rx="10" fill="#FFFFFF" stroke="#6F42C1" stroke-width="2"/>
<text x="500.0" y="372.0" text-anchor="middle" class="box-title">3. Caller sends MCP request</text>
<text x="500.0" y="394.0" text-anchor="middle" class="box-detail">HTTPS + Bearer Token A to Gateway</text>
<rect x="320" y="460" width="360" height="80" rx="10" fill="#EAF2F8" stroke="#2E74B5" stroke-width="2"/>
<text x="500.0" y="492.0" text-anchor="middle" class="box-title">4. Gateway JWT validation</text>
<text x="500.0" y="514.0" text-anchor="middle" class="box-detail">Issuer, audience, client and scope/claims</text>
<rect x="320" y="580" width="360" height="80" rx="10" fill="#EAF2F8" stroke="#2E74B5" stroke-width="2"/>
<text x="500.0" y="612.0" text-anchor="middle" class="box-title">5. Gateway Policy</text>
<text x="500.0" y="634.0" text-anchor="middle" class="box-detail">Deterministic tool and input authorization</text>
<rect x="320" y="700" width="360" height="80" rx="10" fill="#EAF2F8" stroke="#2E74B5" stroke-width="2"/>
<text x="500.0" y="732.0" text-anchor="middle" class="box-title">6. Gateway invokes Runtime target</text>
<text x="500.0" y="754.0" text-anchor="middle" class="box-detail">SigV4 using the Gateway service role</text>
<rect x="320" y="820" width="360" height="80" rx="10" fill="#EAF2F8" stroke="#2E74B5" stroke-width="2"/>
<text x="500.0" y="852.0" text-anchor="middle" class="box-title">7. Runtime validation</text>
<text x="500.0" y="874.0" text-anchor="middle" class="box-detail">Schema, site, path and write controls</text>
<rect x="320" y="940" width="360" height="90" rx="10" fill="#FFF3E0" stroke="#C56A00" stroke-width="2"/>
<text x="500.0" y="977.0" text-anchor="middle" class="box-title">8. Microsoft Graph / SharePoint</text>
<text x="500.0" y="999.0" text-anchor="middle" class="box-detail">Graph API call + Token B; selected permission</text>
<rect x="35" y="235" width="235" height="105" rx="10" fill="#FFFFFF" stroke="#6F42C1" stroke-width="2"/>
<text x="152.5" y="268.5" text-anchor="middle" class="box-title">Credential boundary A</text>
<text x="152.5" y="290.5" text-anchor="middle" class="box-detail">Enterprise MCP API token</text>
<text x="152.5" y="312.5" text-anchor="middle" class="box-detail">returned to caller</text>
<rect x="35" y="480" width="235" height="180" rx="10" fill="#FDEDEC" stroke="#B42318" stroke-width="2"/>
<text x="152.5" y="551.0" text-anchor="middle" class="box-title">Fail closed</text>
<text x="152.5" y="573.0" text-anchor="middle" class="box-detail">Invalid token, denied policy</text>
<text x="152.5" y="595.0" text-anchor="middle" class="box-detail">or invalid Runtime input</text>
<rect x="730" y="685" width="235" height="110" rx="10" fill="#FFFFFF" stroke="#2E74B5" stroke-width="2"/>
<text x="847.5" y="721.0" text-anchor="middle" class="box-title">AWS IAM boundary</text>
<text x="847.5" y="743.0" text-anchor="middle" class="box-detail">Gateway service role signs call</text>
<text x="847.5" y="765.0" text-anchor="middle" class="box-detail">Runtime role remains separate</text>
<rect x="730" y="930" width="235" height="110" rx="10" fill="#FFFFFF" stroke="#C56A00" stroke-width="2"/>
<text x="847.5" y="966.0" text-anchor="middle" class="box-title">Credential boundary B</text>
<text x="847.5" y="988.0" text-anchor="middle" class="box-detail">Runtime obtains Graph token</text>
<text x="847.5" y="1010.0" text-anchor="middle" class="box-detail">never reuse Token A</text>
<rect x="35" y="1090" width="235" height="120" rx="10" fill="#EAF6EC" stroke="#2E7D32" stroke-width="2"/>
<text x="152.5" y="1131.0" text-anchor="middle" class="box-title">Audit metadata</text>
<text x="152.5" y="1153.0" text-anchor="middle" class="box-detail">Decision + result metadata</text>
<text x="152.5" y="1175.0" text-anchor="middle" class="box-detail">No secrets or documents</text>
</svg>
